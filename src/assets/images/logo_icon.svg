<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient Nền Icon Squircle (Xanh Ngọc 3D bóng bẩy) -->
    <linearGradient id="sqBgGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f576" />
      <stop offset="30%" stop-color="#00c853" />
      <stop offset="70%" stop-color="#007e33" />
      <stop offset="100%" stop-color="#003d19" />
    </linearGradient>

    <!-- Viền phản quang Neon sáng bóng góc trên-trái -->
    <linearGradient id="sqRimGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <!-- Gradient Mặt Trời Vàng Nắng Rực Rỡ -->
    <linearGradient id="sunSphereGradIcon" x1="20%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="40%" stop-color="#ffca28" />
      <stop offset="85%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <!-- Gradient Lá Vàng Hậu Cảnh -->
    <linearGradient id="goldLeafGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8f00" />
      <stop offset="60%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#fff9c4" />
    </linearGradient>

    <!-- Gradient Lá Xanh Tiền Cảnh -->
    <linearGradient id="frontLeafGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007e33" />
      <stop offset="50%" stop-color="#00c853" />
      <stop offset="100%" stop-color="#69f0ae" />
    </linearGradient>
  </defs>

  <!-- Khối Squircle Nền Xanh Ngọc Bóng Bẩy -->
  <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#sqBgGradIcon)" />

  <!-- Viền Neon Sáng Bóng Phản Quang -->
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="url(#sqRimGradIcon)" stroke-width="2" />

  <!-- Lớp kính lóa sáng góc trên -->
  <path d="M 0,18 C 0,8 8,0 18,0 L 40,0 C 18,0 0,18 0,40 Z" fill="#ffffff" opacity="0.32" />

  <!-- Cung sáng phản chiếu đáy icon -->
  <path d="M 12,56 C 24,62 40,62 52,56" fill="none" stroke="#69f0ae" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />

  <!-- Mặt trời vàng rực rỡ với tia nắng hoa cúc -->
  <g transform="translate(43, 22)">
    <g stroke="#ffca28" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-14" x2="0" y2="-11" />
      <line x1="10" y1="-10" x2="8" y2="-8" />
      <line x1="14" y1="0" x2="11" y2="0" />
      <line x1="10" y1="10" x2="8" y2="8" />
      <line x1="0" y1="14" x2="0" y2="11" />
      <line x1="-10" y1="10" x2="-8" y2="8" />
      <line x1="-14" y1="0" x2="-11" y2="0" />
      <line x1="-10" y1="-10" x2="-8" y2="-8" />
    </g>
    <circle cx="0" cy="0" r="9.5" fill="url(#sunSphereGradIcon)" />
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Lá vàng đâm chồi -->
  <path d="M 28,42 C 37,30 50,31 53,35 C 51,44 39,48 28,42 Z" 
        fill="url(#goldLeafGradIcon)" 
        stroke="#ffe082" 
        stroke-width="1.2" />

  <!-- Chiếc lá xanh viền trắng dày nổi khối -->
  <path d="M 16,47 C 14,31 28,16 46,18 C 45,33 34,49 16,47 Z" fill="#00240f" opacity="0.4" />
  <path d="M 16,46 C 14,30 27,15 45,17 C 44,32 33,48 16,46 Z" 
        fill="url(#frontLeafGradIcon)" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linejoin="round" />
  <path d="M 20,43 Q 29,31 40,22" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
</svg>
